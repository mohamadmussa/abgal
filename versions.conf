# The SDK parts AbGal is built against. One line per part.
#
# abgal setup reads this file to fetch what is missing into sdk/, and
# abgal doctor reads it to say what is there, what is missing and what is
# too old. Every part lands in sdk/. The Android CLI, which installs the
# parts with source "android", puts itself into android-home/ in the clone
# on first use.
#
# Columns, separated by |:
#
#   part      the folder under sdk/ that holds it. For "android" it is
#             also the package name the Android CLI is given
#   minimum   the oldest revision AbGal runs with, compared against
#             Pkg.Revision in the part's source.properties
#   source    where setup gets it. A zip is fetched from its url and
#             checked against the sha1 after it. "android" means the
#             Android CLI from the command line tools installs the part
#   sha1      the checksum of the zip, empty for "android"
#
# The command line tools come first because the other parts are installed
# with the android command they bring. 23.0 is the first version that has
# it. The Android CLI always installs the newest revision, so the minimum is
# what was tested on 2026-09-24, not a pin.
#
# Update a part:
#   1. change the line here
#   2. move the old folder under sdk/ aside and run abgal setup
#   3. run abgal doctor

cmdline-tools/latest | 23.0    | https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip | e025545c62a8e64c7559119566a569fb1dec5f60
platform-tools       | 37.0.1  | android |
emulator             | 37.1.11 | android |
