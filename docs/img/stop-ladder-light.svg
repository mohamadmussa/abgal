<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850.00 992.00" width="850.00" height="992.00" role="img" aria-label="Escalation ladder for abgal stop">
<style>
:root {
  --bg: #ffffff;
  --fg: #1a1a1a;
  --muted: #5b5b63;
  --box-fill: #f4f4f6;
  --box-stroke: #33333d;
  --decision-fill: #eef1fb;
  --track: #dcdce2;
  --accent: #2f5fd6;
  --ok-fill: #e8f7ee;
  --ok-stroke: #1a7f37;
  --bad-fill: #fbeaea;
  --bad-stroke: #b42318;
  --arrow: #33333d;
}
svg { background: var(--bg); }
text { font-family: Helvetica, Arial, sans-serif; fill: var(--fg); }
.label-actor { font-size: 10px; fill: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.label-main { font-size: 12.5px; }
.label-duration { font-size: 11px; font-style: italic; fill: var(--muted); }
.label-edge { font-size: 11px; fill: var(--muted); }
.label-note { font-size: 11px; font-style: italic; fill: var(--muted); }
.box, .box-instant, .box-action { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
.box-decision { fill: var(--decision-fill); stroke: var(--box-stroke); stroke-width: 1.5; stroke-dasharray: 4 3; }
.box-ok { fill: var(--ok-fill); stroke: var(--ok-stroke); stroke-width: 2; }
.box-bad { fill: var(--bad-fill); stroke: var(--bad-stroke); stroke-width: 2; }
.bar-track { fill: var(--track); }
.bar-fill { fill: var(--accent); }
.edge { stroke: var(--arrow); stroke-width: 1.5; fill: none; }
.arrowhead { fill: var(--arrow); }
@keyframes bar-fill { from { width: 0; } to { width: 220.00px; } }
#bar-fill-poll { animation: bar-fill 4.00s linear infinite; }
#bar-fill-wait-term { animation: bar-fill 2.00s linear infinite; }
#bar-fill-wait-kill { animation: bar-fill 2.00s linear infinite; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="arrowhead" d="M 0 0 L 10 5 L 0 10 z"/>
</marker>
</defs>
<g id="step-kill">
<rect class="box box-action" x="30.00" y="30.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="44.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="58.00" text-anchor="middle">adb emu kill sent to the guest's</text>
<text class="label-main" x="160.00" y="70.00" text-anchor="middle">serial</text>
</g>
<g id="step-poll">
<rect class="box box-poll" x="30.00" y="126.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="140.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="154.00" text-anchor="middle">poll every 1 s for the process to</text>
<text class="label-main" x="160.00" y="166.00" text-anchor="middle">end (--grace, overridable)</text>
<text class="label-duration" x="160.00" y="180.00" text-anchor="middle">up to 20 s</text>
<rect class="bar-track" x="50.00" y="186.00" width="220.00" height="6.00" rx="3" ry="3"/>
<rect id="bar-fill-poll" class="bar-fill" x="50.00" y="186.00" width="0" height="6.00" rx="3" ry="3"/>
</g>
<g id="step-decision-grace">
<rect class="box box-decision" x="30.00" y="222.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="236.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="250.00" text-anchor="middle">still running after the grace</text>
<text class="label-main" x="160.00" y="262.00" text-anchor="middle">window?</text>
</g>
<g id="step-sigterm">
<rect class="box box-action" x="120.00" y="318.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="250.00" y="332.00" text-anchor="middle">abgal</text>
<text class="label-main" x="250.00" y="346.00" text-anchor="middle">SIGTERM sent to the pid</text>
</g>
<g id="step-wait-term">
<rect class="box box-wait" x="120.00" y="414.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="250.00" y="428.00" text-anchor="middle">abgal</text>
<text class="label-main" x="250.00" y="442.00" text-anchor="middle">wait for the process to end</text>
<text class="label-duration" x="250.00" y="468.00" text-anchor="middle">10 s</text>
<rect class="bar-track" x="140.00" y="474.00" width="220.00" height="6.00" rx="3" ry="3"/>
<rect id="bar-fill-wait-term" class="bar-fill" x="140.00" y="474.00" width="0" height="6.00" rx="3" ry="3"/>
</g>
<g id="step-decision-term">
<rect class="box box-decision" x="120.00" y="510.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="250.00" y="524.00" text-anchor="middle">abgal</text>
<text class="label-main" x="250.00" y="538.00" text-anchor="middle">still running after SIGTERM?</text>
</g>
<g id="step-sigkill">
<rect class="box box-action" x="210.00" y="606.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="340.00" y="620.00" text-anchor="middle">abgal</text>
<text class="label-main" x="340.00" y="634.00" text-anchor="middle">SIGKILL sent to the pid</text>
</g>
<g id="step-wait-kill">
<rect class="box box-wait" x="210.00" y="702.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="340.00" y="716.00" text-anchor="middle">abgal</text>
<text class="label-main" x="340.00" y="730.00" text-anchor="middle">wait for the process to end</text>
<text class="label-duration" x="340.00" y="756.00" text-anchor="middle">10 s</text>
<rect class="bar-track" x="230.00" y="762.00" width="220.00" height="6.00" rx="3" ry="3"/>
<rect id="bar-fill-wait-kill" class="bar-fill" x="230.00" y="762.00" width="0" height="6.00" rx="3" ry="3"/>
</g>
<g id="step-decision-kill">
<rect class="box box-decision" x="210.00" y="798.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="340.00" y="812.00" text-anchor="middle">abgal</text>
<text class="label-main" x="340.00" y="826.00" text-anchor="middle">still running after SIGKILL?</text>
</g>
<g id="step-stopped">
<rect class="box box-terminal box-ok" x="620.00" y="510.00" width="200.00" height="68.00" rx="34.00" ry="34.00"/>
<text class="label-actor" x="720.00" y="524.00" text-anchor="middle">abgal</text>
<text class="label-main" x="720.00" y="538.00" text-anchor="middle">stopped</text>
</g>
<g id="step-running">
<rect class="box box-terminal box-bad" x="210.00" y="894.00" width="260.00" height="68.00" rx="34.00" ry="34.00"/>
<text class="label-actor" x="340.00" y="908.00" text-anchor="middle">abgal</text>
<text class="label-main" x="340.00" y="922.00" text-anchor="middle">still running. Nothing else this</text>
<text class="label-main" x="340.00" y="934.00" text-anchor="middle">program can do.</text>
</g>
<line class="edge" x1="160.00" y1="98.00" x2="160.00" y2="126.00" marker-end="url(#arrow)"/>
<line class="edge" x1="160.00" y1="194.00" x2="160.00" y2="222.00" marker-end="url(#arrow)"/>
<line class="edge" x1="160.00" y1="290.00" x2="250.00" y2="318.00" marker-end="url(#arrow)"/>
<text class="label-edge" x="170.00" y="304.00" text-anchor="middle">yes</text>
<path class="edge" d="M 290.00 256.00 C 455.00 256.00, 455.00 544.00, 620.00 544.00" marker-end="url(#arrow)"/>
<text class="label-edge" x="300.00" y="248.00" text-anchor="middle">no</text>
<line class="edge" x1="250.00" y1="386.00" x2="250.00" y2="414.00" marker-end="url(#arrow)"/>
<line class="edge" x1="250.00" y1="482.00" x2="250.00" y2="510.00" marker-end="url(#arrow)"/>
<line class="edge" x1="250.00" y1="578.00" x2="340.00" y2="606.00" marker-end="url(#arrow)"/>
<text class="label-edge" x="260.00" y="592.00" text-anchor="middle">yes</text>
<path class="edge" d="M 380.00 544.00 C 500.00 544.00, 500.00 544.00, 620.00 544.00" marker-end="url(#arrow)"/>
<text class="label-edge" x="390.00" y="536.00" text-anchor="middle">no</text>
<line class="edge" x1="340.00" y1="674.00" x2="340.00" y2="702.00" marker-end="url(#arrow)"/>
<line class="edge" x1="340.00" y1="770.00" x2="340.00" y2="798.00" marker-end="url(#arrow)"/>
<line class="edge" x1="340.00" y1="866.00" x2="340.00" y2="894.00" marker-end="url(#arrow)"/>
<text class="label-edge" x="350.00" y="880.00" text-anchor="middle">yes</text>
<path class="edge" d="M 470.00 832.00 C 545.00 832.00, 545.00 544.00, 620.00 544.00" marker-end="url(#arrow)"/>
<text class="label-edge" x="480.00" y="824.00" text-anchor="middle">no</text>
</svg>
