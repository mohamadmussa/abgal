<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580.00 896.00" width="580.00" height="896.00" role="img" aria-label="The nine steps of abgal create">
<style>
:root {
  --bg: #ffffff;
  --fg: #1a1a1a;
  --muted: #5b5b63;
  --box-fill: #f4f4f6;
  --box-stroke: #33333d;
  --decision-fill: #eef1fb;
  --track: #dcdce2;
  --accent: #2f5fd6;
  --ok-fill: #e8f7ee;
  --ok-stroke: #1a7f37;
  --bad-fill: #fbeaea;
  --bad-stroke: #b42318;
  --arrow: #33333d;
}
svg { background: var(--bg); }
text { font-family: Helvetica, Arial, sans-serif; fill: var(--fg); }
.label-actor { font-size: 9px; fill: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.label-main { font-size: 11.5px; }
.label-duration { font-size: 10px; font-style: italic; fill: var(--muted); }
.label-edge { font-size: 10px; fill: var(--muted); }
.label-note { font-size: 10px; font-style: italic; fill: var(--muted); }
.box, .box-instant, .box-action { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
.box-decision { fill: var(--decision-fill); stroke: var(--box-stroke); stroke-width: 1.5; stroke-dasharray: 4 3; }
.box-ok { fill: var(--ok-fill); stroke: var(--ok-stroke); stroke-width: 2; }
.box-bad { fill: var(--bad-fill); stroke: var(--bad-stroke); stroke-width: 2; }
.bar-track { fill: var(--track); }
.bar-fill { fill: var(--accent); }
.edge { stroke: var(--arrow); stroke-width: 1.5; fill: none; }
.arrowhead { fill: var(--arrow); }
@keyframes bar-fill { from { width: 0; } to { width: 220.00px; } }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="arrowhead" d="M 0 0 L 10 5 L 0 10 z"/>
</marker>
</defs>
<g id="step-refuse-name">
<rect class="box box-action" x="30.00" y="30.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="44.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="58.00" text-anchor="middle">refuses a name outside letters,</text>
<text class="label-main" x="160.00" y="70.00" text-anchor="middle">digits, dot, underscore, dash</text>
</g>
<g id="step-check-screen">
<rect class="box box-action" x="30.00" y="126.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="140.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="154.00" text-anchor="middle">checks the screen is listed by</text>
<text class="label-main" x="160.00" y="166.00" text-anchor="middle">avdmanager list device</text>
</g>
<g id="step-fetch-image">
<rect class="box box-action" x="30.00" y="222.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="236.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="250.00" text-anchor="middle">fetches the system image, unless</text>
<text class="label-main" x="160.00" y="262.00" text-anchor="middle">sdk/system-images/ has it</text>
</g>
<g id="step-refuse-running">
<rect class="box box-action" x="30.00" y="318.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="332.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="346.00" text-anchor="middle">refuses a running guest, since a</text>
<text class="label-main" x="160.00" y="358.00" text-anchor="middle">start rewrites config.ini</text>
</g>
<g id="step-recreate-or-keep">
<rect class="box box-action" x="30.00" y="414.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="428.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="442.00" text-anchor="middle">with --recreate, deletes the guest</text>
<text class="label-main" x="160.00" y="454.00" text-anchor="middle">first. Otherwise keeps its disk</text>
</g>
<g id="step-create-avd">
<rect class="box box-action" x="30.00" y="510.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="524.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="538.00" text-anchor="middle">creates avd/, calls avdmanager</text>
<text class="label-main" x="160.00" y="550.00" text-anchor="middle">create avd</text>
</g>
<g id="step-write-template">
<rect class="box box-action" x="30.00" y="606.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="620.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="634.00" text-anchor="middle">writes abgal-template next to</text>
<text class="label-main" x="160.00" y="646.00" text-anchor="middle">config.ini</text>
</g>
<g id="step-pin-values">
<rect class="box box-action" x="30.00" y="702.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="716.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="730.00" text-anchor="middle">pins five values in config.ini, a</text>
<text class="label-main" x="160.00" y="742.00" text-anchor="middle">sixth for the store template</text>
</g>
<g id="step-verify-values">
<rect class="box box-action" x="30.00" y="798.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="812.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="826.00" text-anchor="middle">reads config.ini back, compares</text>
<text class="label-main" x="160.00" y="838.00" text-anchor="middle">thirteen values it asked for</text>
</g>
<line class="edge" x1="160.00" y1="98.00" x2="160.00" y2="126.00" marker-end="url(#arrow)"/>
<line class="edge" x1="160.00" y1="194.00" x2="160.00" y2="222.00" marker-end="url(#arrow)"/>
<line class="edge" x1="160.00" y1="290.00" x2="160.00" y2="318.00" marker-end="url(#arrow)"/>
<line class="edge" x1="160.00" y1="386.00" x2="160.00" y2="414.00" marker-end="url(#arrow)"/>
<line class="edge" x1="160.00" y1="482.00" x2="160.00" y2="510.00" marker-end="url(#arrow)"/>
<line class="edge" x1="160.00" y1="578.00" x2="160.00" y2="606.00" marker-end="url(#arrow)"/>
<line class="edge" x1="160.00" y1="674.00" x2="160.00" y2="702.00" marker-end="url(#arrow)"/>
<line class="edge" x1="160.00" y1="770.00" x2="160.00" y2="798.00" marker-end="url(#arrow)"/>
</svg>
