<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580.00 896.00" width="580.00" height="896.00" role="img" aria-label="States abgal watch moves through">
<style>
:root {
  --bg: #ffffff;
  --fg: #1a1a1a;
  --muted: #5b5b63;
  --box-fill: #f4f4f6;
  --box-stroke: #33333d;
  --decision-fill: #eef1fb;
  --track: #dcdce2;
  --accent: #2f5fd6;
  --ok-fill: #e8f7ee;
  --ok-stroke: #1a7f37;
  --bad-fill: #fbeaea;
  --bad-stroke: #b42318;
  --arrow: #33333d;
}
svg { background: var(--bg); }
text { font-family: Helvetica, Arial, sans-serif; fill: var(--fg); }
.label-actor { font-size: 10px; fill: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.label-main { font-size: 12.5px; }
.label-duration { font-size: 11px; font-style: italic; fill: var(--muted); }
.label-edge { font-size: 11px; fill: var(--muted); }
.label-note { font-size: 11px; font-style: italic; fill: var(--muted); }
.box, .box-instant, .box-action { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
.box-decision { fill: var(--decision-fill); stroke: var(--box-stroke); stroke-width: 1.5; stroke-dasharray: 4 3; }
.box-ok { fill: var(--ok-fill); stroke: var(--ok-stroke); stroke-width: 2; }
.box-bad { fill: var(--bad-fill); stroke: var(--bad-stroke); stroke-width: 2; }
.bar-track { fill: var(--track); }
.bar-fill { fill: var(--accent); }
.edge { stroke: var(--arrow); stroke-width: 1.5; fill: none; }
.arrowhead { fill: var(--arrow); }
@keyframes bar-fill { from { width: 0; } to { width: 220.00px; } }
#bar-fill-warmup-poll { animation: bar-fill 7.87s linear infinite; }
#bar-fill-main-poll { animation: bar-fill 0.40s linear 4; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="arrowhead" d="M 0 0 L 10 5 L 0 10 z"/>
</marker>
</defs>
<g id="step-temp-check">
<rect class="box box-instant" x="30.00" y="30.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="44.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="58.00" text-anchor="middle">reads the temperature once, from</text>
<text class="label-main" x="160.00" y="70.00" text-anchor="middle">x86_pkg_temp or sensors</text>
</g>
<g id="step-decision-temp">
<rect class="box box-decision" x="30.00" y="126.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="140.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="154.00" text-anchor="middle">temperature measurable?</text>
</g>
<g id="step-abort-no-temp">
<rect class="box box-terminal box-bad" x="350.00" y="126.00" width="200.00" height="68.00" rx="34.00" ry="34.00"/>
<text class="label-actor" x="450.00" y="140.00" text-anchor="middle">abgal</text>
<text class="label-main" x="450.00" y="154.00" text-anchor="middle">aborted. No temperature</text>
<text class="label-main" x="450.00" y="166.00" text-anchor="middle">measurable at all.</text>
</g>
<g id="step-warmup-poll">
<rect class="box box-poll" x="30.00" y="222.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="236.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="250.00" text-anchor="middle">polls every 5 s for a guest to</text>
<text class="label-main" x="160.00" y="262.00" text-anchor="middle">appear, up to --warmup</text>
<text class="label-duration" x="160.00" y="276.00" text-anchor="middle">up to 120 s</text>
<rect class="bar-track" x="50.00" y="282.00" width="220.00" height="6.00" rx="3" ry="3"/>
<rect id="bar-fill-warmup-poll" class="bar-fill" x="50.00" y="282.00" width="0" height="6.00" rx="3" ry="3"/>
</g>
<g id="step-decision-warmup">
<rect class="box box-decision" x="30.00" y="318.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="332.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="346.00" text-anchor="middle">guest appeared within warmup?</text>
</g>
<g id="step-warmup-timeout">
<rect class="box box-terminal box-ok" x="350.00" y="318.00" width="200.00" height="68.00" rx="34.00" ry="34.00"/>
<text class="label-actor" x="450.00" y="332.00" text-anchor="middle">abgal</text>
<text class="label-main" x="450.00" y="346.00" text-anchor="middle">no emulator appeared.</text>
<text class="label-main" x="450.00" y="358.00" text-anchor="middle">Watch off.</text>
</g>
<g id="step-main-poll">
<rect class="box box-poll" x="30.00" y="414.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="428.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="442.00" text-anchor="middle">polls every 2 s (--interval), no</text>
<text class="label-main" x="160.00" y="454.00" text-anchor="middle">limit, until stopped or aborted</text>
<text class="label-duration" x="160.00" y="468.00" text-anchor="middle">2 s, no limit ...</text>
<rect class="bar-track" x="50.00" y="474.00" width="220.00" height="6.00" rx="3" ry="3"/>
<rect id="bar-fill-main-poll" class="bar-fill" x="50.00" y="474.00" width="0" height="6.00" rx="3" ry="3"/>
</g>
<g id="step-decision-guests">
<rect class="box box-decision" x="30.00" y="510.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="524.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="538.00" text-anchor="middle">guests still present?</text>
</g>
<g id="step-watch-off">
<rect class="box box-terminal box-ok" x="350.00" y="510.00" width="200.00" height="68.00" rx="34.00" ry="34.00"/>
<text class="label-actor" x="450.00" y="524.00" text-anchor="middle">abgal</text>
<text class="label-main" x="450.00" y="538.00" text-anchor="middle">no guests left. Watch off,</text>
<text class="label-main" x="450.00" y="550.00" text-anchor="middle">highest value logged.</text>
</g>
<g id="step-decision-readable">
<rect class="box box-decision" x="30.00" y="606.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="620.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="634.00" text-anchor="middle">temperature readable?</text>
</g>
<g id="step-unreadable">
<rect class="box box-instant" x="350.00" y="606.00" width="200.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="450.00" y="620.00" text-anchor="middle">abgal</text>
<text class="label-main" x="450.00" y="634.00" text-anchor="middle">unreadable. Retries,</text>
<text class="label-main" x="450.00" y="646.00" text-anchor="middle">aborts at 4 in a row.</text>
</g>
<g id="step-decision-stop">
<rect class="box box-decision" x="30.00" y="702.00" width="260.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="160.00" y="716.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="730.00" text-anchor="middle">at or above stop (96 C default)?</text>
</g>
<g id="step-retry">
<rect class="box box-instant" x="350.00" y="702.00" width="200.00" height="68.00" rx="8.00" ry="8.00"/>
<text class="label-actor" x="450.00" y="716.00" text-anchor="middle">abgal</text>
<text class="label-main" x="450.00" y="730.00" text-anchor="middle">below stop. Waits</text>
<text class="label-main" x="450.00" y="742.00" text-anchor="middle">--interval, polls again.</text>
</g>
<g id="step-ref-stop-ladder">
<rect class="box box-terminal box-ok" x="30.00" y="798.00" width="260.00" height="68.00" rx="34.00" ry="34.00"/>
<text class="label-actor" x="160.00" y="812.00" text-anchor="middle">abgal</text>
<text class="label-main" x="160.00" y="826.00" text-anchor="middle">stop cascade for every guest. See</text>
<text class="label-main" x="160.00" y="838.00" text-anchor="middle">stop-ladder.</text>
</g>
<line class="edge" x1="160.00" y1="98.00" x2="160.00" y2="126.00" marker-end="url(#arrow)"/>
<line class="edge" x1="160.00" y1="194.00" x2="160.00" y2="222.00" marker-end="url(#arrow)"/>
<text class="label-edge" x="170.00" y="208.00" text-anchor="middle">yes</text>
<path class="edge" d="M 290.00 160.00 C 320.00 160.00, 320.00 160.00, 350.00 160.00" marker-end="url(#arrow)"/>
<text class="label-edge" x="300.00" y="152.00" text-anchor="middle">no</text>
<line class="edge" x1="160.00" y1="290.00" x2="160.00" y2="318.00" marker-end="url(#arrow)"/>
<line class="edge" x1="160.00" y1="386.00" x2="160.00" y2="414.00" marker-end="url(#arrow)"/>
<text class="label-edge" x="170.00" y="400.00" text-anchor="middle">yes</text>
<path class="edge" d="M 290.00 352.00 C 320.00 352.00, 320.00 352.00, 350.00 352.00" marker-end="url(#arrow)"/>
<text class="label-edge" x="300.00" y="344.00" text-anchor="middle">no</text>
<line class="edge" x1="160.00" y1="482.00" x2="160.00" y2="510.00" marker-end="url(#arrow)"/>
<line class="edge" x1="160.00" y1="578.00" x2="160.00" y2="606.00" marker-end="url(#arrow)"/>
<text class="label-edge" x="170.00" y="592.00" text-anchor="middle">yes</text>
<path class="edge" d="M 290.00 544.00 C 320.00 544.00, 320.00 544.00, 350.00 544.00" marker-end="url(#arrow)"/>
<text class="label-edge" x="300.00" y="536.00" text-anchor="middle">no</text>
<line class="edge" x1="160.00" y1="674.00" x2="160.00" y2="702.00" marker-end="url(#arrow)"/>
<text class="label-edge" x="170.00" y="688.00" text-anchor="middle">yes</text>
<path class="edge" d="M 290.00 640.00 C 320.00 640.00, 320.00 640.00, 350.00 640.00" marker-end="url(#arrow)"/>
<text class="label-edge" x="300.00" y="632.00" text-anchor="middle">no</text>
<line class="edge" x1="160.00" y1="770.00" x2="160.00" y2="798.00" marker-end="url(#arrow)"/>
<text class="label-edge" x="170.00" y="784.00" text-anchor="middle">yes</text>
<path class="edge" d="M 290.00 736.00 C 320.00 736.00, 320.00 736.00, 350.00 736.00" marker-end="url(#arrow)"/>
<text class="label-edge" x="300.00" y="728.00" text-anchor="middle">no</text>
</svg>
