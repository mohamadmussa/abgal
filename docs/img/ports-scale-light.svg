<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300.00 332.00" width="1300.00" height="332.00" role="img" aria-label="How abgal start fills the 16 emulator ports">
<style>
:root {
  --bg: #ffffff;
  --fg: #1a1a1a;
  --muted: #5b5b63;
  --box-fill: #f4f4f6;
  --box-stroke: #33333d;
  --decision-fill: #eef1fb;
  --track: #dcdce2;
  --accent: #2f5fd6;
  --ok-fill: #e8f7ee;
  --ok-stroke: #1a7f37;
  --bad-fill: #fbeaea;
  --bad-stroke: #b42318;
  --arrow: #33333d;
}
svg { background: var(--bg); }
text { font-family: Helvetica, Arial, sans-serif; fill: var(--fg); }
.label-actor { font-size: 10px; fill: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.label-main { font-size: 12.5px; }
.label-duration { font-size: 11px; font-style: italic; fill: var(--muted); }
.label-edge { font-size: 11px; fill: var(--muted); }
.label-note { font-size: 11px; font-style: italic; fill: var(--muted); }
.box, .box-instant, .box-action { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
.box-decision { fill: var(--decision-fill); stroke: var(--box-stroke); stroke-width: 1.5; stroke-dasharray: 4 3; }
.box-ok { fill: var(--ok-fill); stroke: var(--ok-stroke); stroke-width: 2; }
.box-bad { fill: var(--bad-fill); stroke: var(--bad-stroke); stroke-width: 2; }
.bar-track { fill: var(--track); }
.bar-fill { fill: var(--accent); }
.edge { stroke: var(--arrow); stroke-width: 1.5; fill: none; }
.arrowhead { fill: var(--arrow); }
@keyframes bar-fill { from { width: 0; } to { width: 220.00px; } }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="arrowhead" d="M 0 0 L 10 5 L 0 10 z"/>
</marker>
</defs>
<text class="label-main" x="650.00" y="44.00" text-anchor="middle">abgal --port: 16 slots, 5554 to 5584, even only. Outside that, adb cannot find the guest.</text>
<text class="label-note" x="650.00" y="60.00" text-anchor="middle">Illustrative fill sequence below, not a measured run. Which ports are actually busy is runtime state; abgal does not track it.</text>
