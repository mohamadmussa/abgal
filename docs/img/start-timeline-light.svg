<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650.00 392.00" width="650.00" height="392.00" role="img" aria-label="Timeline of the real waits abgal start goes through">
<style>
:root {
  --bg: #ffffff;
  --fg: #1a1a1a;
  --muted: #5b5b63;
  --box-fill: #f4f4f6;
  --box-stroke: #33333d;
  --decision-fill: #eef1fb;
  --track: #dcdce2;
  --accent: #2f5fd6;
  --ok-fill: #e8f7ee;
  --ok-stroke: #1a7f37;
  --bad-fill: #fbeaea;
  --bad-stroke: #b42318;
  --arrow: #33333d;
}
svg { background: var(--bg); }
text { font-family: Helvetica, Arial, sans-serif; fill: var(--fg); }
.label-actor { font-size: 9px; fill: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.label-main { font-size: 11.5px; }
.label-duration { font-size: 10px; font-style: italic; fill: var(--muted); }
.label-edge { font-size: 10px; fill: var(--muted); }
.label-note { font-size: 10px; font-style: italic; fill: var(--muted); }
.box, .box-instant, .box-action { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
.box-decision { fill: var(--decision-fill); stroke: var(--box-stroke); stroke-width: 1.5; stroke-dasharray: 4 3; }
.box-ok { fill: var(--ok-fill); stroke: var(--ok-stroke); stroke-width: 2; }
.box-bad { fill: var(--bad-fill); stroke: var(--bad-stroke); stroke-width: 2; }
.bar-track { fill: var(--track); }
.bar-fill { fill: var(--accent); }
.edge { stroke: var(--arrow); stroke-width: 1.5; fill: none; }
.arrowhead { fill: var(--arrow); }
@keyframes bar-fill { from { width: 0; } to { width: 220.00px; } }
#bar-fill-poll-console { animation: bar-fill 3.99s linear infinite; }
#bar-fill-wait-settle { animation: bar-fill 0.40s linear infinite; }
#bar-fill-poll-boot { animation: bar-fill 3.99s linear infinite; }
</style>
<style>
.tl-tick { fill: var(--accent); opacity: 0; }
@keyframes flash-tl-preflight { 0% { opacity: 0; } 0.75% { opacity: 1; } 2.50% { opacity: 0; } 100% { opacity: 0; } }
#tl-tick-preflight { animation: flash-tl-preflight 8.00s linear infinite; animation-delay: 0.00s; }
@keyframes flash-tl-launch { 0% { opacity: 0; } 0.75% { opacity: 1; } 2.50% { opacity: 0; } 100% { opacity: 0; } }
#tl-tick-launch { animation: flash-tl-launch 8.00s linear infinite; animation-delay: 0.20s; }
@keyframes grow-poll-console { 0% { width: 0; } 2.49% { width: 229.24px; } 47.34% { width: 229.24px; } 49.83% { width: 0; } 100% { width: 0; } }
#tl-bar-poll-console { animation: grow-poll-console 8.00s ease-out infinite; animation-delay: 0.40s; }
@keyframes flash-tl-start-watch { 0% { opacity: 0; } 0.75% { opacity: 1; } 2.50% { opacity: 0; } 100% { opacity: 0; } }
#tl-tick-start-watch { animation: flash-tl-start-watch 8.00s linear infinite; animation-delay: 4.59s; }
@keyframes grow-wait-settle { 0% { width: 0; } 0.25% { width: 23.00px; } 4.75% { width: 23.00px; } 5.00% { width: 0; } 100% { width: 0; } }
#tl-bar-wait-settle { animation: grow-wait-settle 8.00s ease-out infinite; animation-delay: 4.79s; }
@keyframes grow-poll-boot { 0% { width: 0; } 2.49% { width: 229.24px; } 47.34% { width: 229.24px; } 49.83% { width: 0; } 100% { width: 0; } }
#tl-bar-poll-boot { animation: grow-poll-boot 8.00s ease-out infinite; animation-delay: 5.39s; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="arrowhead" d="M 0 0 L 10 5 L 0 10 z"/>
</marker>
</defs>
<text class="label-note" x="30.00" y="44.00">bar: a real wait, to scale. tick: an instant step.</text>
<text class="label-main" x="30.00" y="89.00">kernel</text>
<rect class="bar-track" x="160.00" y="82.00" width="460.00" height="6.00" rx="4" ry="4"/>
<text class="label-main" x="30.00" y="173.00">emulator</text>
<rect class="bar-track" x="160.00" y="166.00" width="460.00" height="6.00" rx="4" ry="4"/>
<text class="label-main" x="30.00" y="257.00">adb</text>
<rect class="bar-track" x="160.00" y="250.00" width="460.00" height="6.00" rx="4" ry="4"/>
<text class="label-main" x="30.00" y="341.00">temperature watch</text>
<rect class="bar-track" x="160.00" y="334.00" width="460.00" height="6.00" rx="4" ry="4"/>
<circle id="tl-tick-preflight" class="tl-tick" cx="160.00" cy="85.00" r="5.00"/>
<circle id="tl-tick-launch" class="tl-tick" cx="171.50" cy="169.00" r="5.00"/>
<rect id="tl-bar-poll-console" class="bar-fill" x="183.00" y="243.00" width="0" height="20.00" rx="4" ry="4"/>
<text class="label-duration" x="183.00" y="237.00">up to 300 s</text>
<circle id="tl-tick-start-watch" class="tl-tick" cx="423.74" cy="337.00" r="5.00"/>
<rect id="tl-bar-wait-settle" class="bar-fill" x="435.24" y="327.00" width="0" height="20.00" rx="4" ry="4"/>
<text class="label-duration" x="435.24" y="321.00">2 s</text>
<rect id="tl-bar-poll-boot" class="bar-fill" x="469.74" y="243.00" width="0" height="20.00" rx="4" ry="4"/>
<text class="label-duration" x="469.74" y="237.00">up to 300 s</text>
</svg>
