# What has to be true before a branch reaches main. The gate runs here without
# .private-words, which is never committed, so a pass means "no private shapes",
# not "nothing private". The full gate runs locally in .githooks/pre-commit.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit gate over every tracked file
        run: python3 tools/check-private.py --all

      - name: Python compiles
        run: python3 -m py_compile abgal tools/check-private.py

      - name: The program builds its own command line
        run: python3 abgal --help > /dev/null

      # Pinned by version and by hash, so a replaced release file fails here
      # instead of running unnoticed.
      - name: Install ShellCheck 0.10.0
        run: |
          curl -sSLo sc.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  sc.tar.xz" \
            | sha256sum -c -
          tar -xJf sc.tar.xz
          sudo mv shellcheck-v0.10.0/shellcheck /usr/local/bin/
          shellcheck --version

      # A clean run and a run over no files both print nothing, so the list is
      # printed and an empty one fails.
      - name: ShellCheck over the tracked shell files
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(git ls-files -z '*.sh' .githooks/pre-commit)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell file matched. That is a broken pattern, not a clean tree."
            exit 1
          fi
          printf 'Checking %d files:\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck --severity=warning --shell=bash "${files[@]}"
