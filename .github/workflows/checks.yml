# What has to be true before a branch reaches main. tools/run_all.py is the one
# gate, called here the same way .githooks/pre-commit calls it. The gate runs
# here without .private-words, which is never committed, so a pass means "no
# private shapes", not "nothing private".
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The program builds its own command line
        run: python3 abgal --help > /dev/null

      # Pinned by version and by hash, so a replaced release file fails here
      # instead of running unnoticed.
      - name: Install ShellCheck 0.10.0
        run: |
          curl -sSLo sc.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  sc.tar.xz" \
            | sha256sum -c -
          tar -xJf sc.tar.xz
          sudo mv shellcheck-v0.10.0/shellcheck /usr/local/bin/
          shellcheck --version

      # Pinned like ShellCheck.
      - name: Install actionlint 1.7.7
        run: |
          curl -sSLo al.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  al.tar.gz" \
            | sha256sum -c -
          tar -xzf al.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/
          actionlint -version

      - name: Install pytest
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-dev.txt

      # Privacy gate, Python compiles, ShellCheck, actionlint, pytest, in that
      # fixed order, over every tracked file. The same command a contributor
      # runs locally with tools/run-all.sh --all.
      - name: Run the quality gate
        run: python3 tools/run_all.py --all
