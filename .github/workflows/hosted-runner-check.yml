# Whether a GitHub-hosted runner can run AbGal at all, see #94 and #13.
# Triggered by hand, one matrix leg per candidate runner. ubuntu-slim was
# tried and dropped, its container has a fixed single CPU core, below what
# the emulator requires, see #94 for the finding. No arm64 leg is listed,
# the android CLI has no arm64 build upstream, a dead end tracked in #113,
# not something this matrix needs to keep confirming.
# The long run over sustained load from #94 is a separate, later workflow.
name: hosted-runner-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner:
          [
            ubuntu-latest,
            ubuntu-26.04,
            self-hosted,
          ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The default /dev/kvm permissions on a hosted runner grant only the
      # kvm group, and a session opened before group membership changes does
      # not see it. This widens the device node instead, no reboot needed,
      # and is a no-op worth trying even where it may not be allowed to run.
      - name: Widen /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-abgal-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        continue-on-error: true

      # avdmanager, unlike the bundled Android CLI, is the classic tool and
      # needs a system JAVA_HOME. A minimal runner may not ship one.
      - name: Set up Java for avdmanager
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: abgal setup
        id: setup
        run: python3 abgal setup --accept-licenses
        continue-on-error: true

      - name: abgal doctor
        id: doctor
        run: python3 abgal doctor
        continue-on-error: true

      # self-hosted has room to spare, confirmed to run well at 8192ram,
      # see #94. The hosted legs stay on the smallest template, their RAM
      # is shared with the runner itself, not worth widening without a
      # reason.
      - name: Create the guest
        id: create
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          if [ "$RUNNER_LABEL" = "self-hosted" ]; then
            template=phone-1080x2400-480-api35-x86_64-8192ram
          else
            template=phone-1080x2400-480-api35-x86_64
          fi
          python3 abgal create "$template" --as ci
        continue-on-error: true

      # A hosted runner exposes no processor temperature, so the watch
      # abgal start launches by default has nothing to read and refuses to
      # start at all. --no-watch skips it, see #94.
      - name: Start the guest
        id: start
        run: python3 abgal start -n ci --no-watch
        continue-on-error: true

      # A GitHub-hosted runner has no inbound reachable address, binding
      # wider than loopback would not make it reachable anyway. Only
      # self-hosted sits on a real network, so only there is the web UI
      # worth exposing and worth watching by hand.
      - name: Start the web UI
        id: webui
        if: matrix.runner == 'self-hosted'
        run: |
          nohup python3 abgal webui --address 0.0.0.0 --port 8099 > webui.log 2>&1 &
          echo "webui_pid=$!" >> "$GITHUB_ENV"
          echo "Web UI reachable at http://$(hostname -I | awk '{print $1}'):8099/"
        continue-on-error: true

      # Proves the guest holds up under sustained use, not just right after
      # a fresh start, see #94. The curl only runs where the web UI does.
      - name: Hold for 15 minutes with the web UI active
        id: hold
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          sleep 900
          if [ "$RUNNER_LABEL" = "self-hosted" ]; then
            curl --fail --silent --show-error http://127.0.0.1:8099/ -o /dev/null
          fi
        continue-on-error: true

      - name: abgal status
        id: status
        run: python3 abgal status
        continue-on-error: true

      - name: Stop the web UI
        id: stop_webui
        if: always() && matrix.runner == 'self-hosted'
        run: |
          if [ -n "${webui_pid:-}" ]; then
            kill "$webui_pid" || true
          fi
        continue-on-error: true

      - name: Stop the guest
        id: stop
        if: always()
        run: python3 abgal stop -n ci
        continue-on-error: true

      - name: Delete the guest
        id: delete
        if: always()
        run: python3 abgal delete -n ci --yes
        continue-on-error: true

      - name: Record the result
        if: always()
        run: |
          {
            echo "### ${{ matrix.runner }}"
            echo ""
            echo "| step | outcome |"
            echo "|---|---|"
            echo "| setup | ${{ steps.setup.outcome }} |"
            echo "| doctor | ${{ steps.doctor.outcome }} |"
            echo "| create | ${{ steps.create.outcome }} |"
            echo "| start | ${{ steps.start.outcome }} |"
            echo "| webui | ${{ steps.webui.outcome }} |"
            echo "| 15 minute hold | ${{ steps.hold.outcome }} |"
            echo "| status | ${{ steps.status.outcome }} |"
            echo "| stop webui | ${{ steps.stop_webui.outcome }} |"
            echo "| stop | ${{ steps.stop.outcome }} |"
            echo "| delete | ${{ steps.delete.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error keeps every step running so the summary above is
      # complete even when an early step fails, but that leaves the job
      # itself green regardless. Fail it here for real so a passing check
      # in the Actions list means what it says.
      - name: Fail the job if any step failed
        if: always()
        run: |
          for outcome in \
            "${{ steps.setup.outcome }}" \
            "${{ steps.doctor.outcome }}" \
            "${{ steps.create.outcome }}" \
            "${{ steps.start.outcome }}" \
            "${{ steps.webui.outcome }}" \
            "${{ steps.hold.outcome }}" \
            "${{ steps.status.outcome }}" \
            "${{ steps.stop_webui.outcome }}" \
            "${{ steps.stop.outcome }}" \
            "${{ steps.delete.outcome }}"; do
            # webui and stop_webui are skipped by design outside self-hosted,
            # see the "Start the web UI" step's condition above.
            if [ "$outcome" != "success" ] && [ "$outcome" != "skipped" ]; then
              echo "At least one step did not succeed, see the summary above." >&2
              exit 1
            fi
          done
