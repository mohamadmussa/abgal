# Builds the container backend's runner image and pushes it to GHCR, so
# abgal github-runner create --backend container pulls a ready image instead
# of building one on every machine that runs it.
name: runner-image

on:
  push:
    branches: [main]
    paths:
      - "docker/runner/**"
      - ".github/workflows/runner-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/runner
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/abgal-runner:latest
