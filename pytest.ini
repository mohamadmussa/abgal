[pytest]
testpaths = tests
# tests/ on the path so a test can import fakes. importlib mode so two
# folders may each hold a file of the same name.
pythonpath = tests
addopts = --import-mode=importlib
markers =
    e2e: needs a real guest, KVM and the SDK, skipped unless ABGAL_E2E=1
    load: runs several guests for a long time, skipped unless ABGAL_E2E=1
