# The GitHub Actions runner software AbGal installs for a self hosted
# runner. One line per tested build.
#
# abgal github-runner create reads this file to download and verify the
# runner tarball. Nothing here is fetched automatically when GitHub
# publishes a new release; this file only ever changes by hand, after the
# new version was tested. create takes the newest (bottom-most) line for
# the machine's own architecture unless --version names an older one that
# is still listed here. A version not listed here is never installed, not
# even with --version.
#
# Columns, separated by |:
#
#   arch      linux-x64 or linux-arm64, matched against platform.machine()
#   version   the runner release this row is pinned to
#   url       where create downloads the tarball from
#   sha256    the checksum of the tarball, verified by downloading it and
#             hashing it, not copied from the release notes alone
#
# Add a newly tested version:
#   1. branch from main
#   2. append new line(s) below, one per architecture, with the real url
#      and a sha256 checked by hand against the actual download
#   3. run abgal github-runner create --version <new> on the branch and
#      confirm the runner registers and shows "Listening for Jobs"
#   4. merge only after that succeeds. Older lines stay unless a runner
#      still using them is retired, then remove that line by hand

