# The templates. One line per kind of virtual device.
#
# A line here describes a class of device, not a running guest. Guests are
# created from a template and carry a name of your choosing:
#
#   abgal create phone-1080x2400-480-api35-x86_64 --as nightly --count 10
#
# creates nightly-01 to nightly-10, all from the same template and all
# sharing the one system image on disk. This list therefore stays short no
# matter how many guests exist.
#
# Columns, separated by |:
#
#   template   the name of this template
#   device     the id from devices.xml, describes screen and density
#   api        Android API level
#   tag        google_apis, google_apis_playstore or default
#   abi        the instruction set the guest runs, x86_64 or arm64-v8a
#   ram        memory in MB
#   note       what this template is for
#
# The name repeats resolution, density, API level and instruction set on
# purpose. A name that only becomes unambiguous after reading this table is
# not a name. The instruction set is spelled exactly as the SDK spells it in
# a system image path, so the two can be compared without a lookup table.
#
# There is no port column. A port belongs to a running guest, not to a class
# of device. Without -port the emulator searches upwards from 5554 in steps
# of two and binds the first free pair itself, which is one step instead of
# a check followed by a start that can still lose a race.
#
# Add a template:
#   1. describe the screen in devices.xml, if it is not there yet
#   2. add a line here
#   3. abgal create <template> --as <name>

# template                               | device              | api | tag                   | abi    | ram  | note
phone-1080x2400-480-api35-x86_64         | phone-1080x2400-480 | 35  | google_apis           | x86_64 | 4096 | Phone class screen at 480 dpi, Google services without a store
phone-1080x2400-480-api35-x86_64-store   | phone-1080x2400-480 | 35  | google_apis_playstore | x86_64 | 4096 | The same screen with the Play Store, for installing an app from it
